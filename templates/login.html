{% extends "base.html" %}

{% block title %}Login - LifeLink{% endblock %}

{% block extra_styles %}
<style>
    .auth-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }

    .auth-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .auth-logo {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
    }

    .auth-title {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 0.4rem;
        letter-spacing: -0.5px;
    }

    .auth-subtitle {
        text-align: center;
        color: rgba(255,255,255,0.45);
        font-size: 0.9rem;
        margin-bottom: 2rem;
    }

    /* Override base.html form styles for dark theme */
    .auth-card form {
        background: transparent;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
        margin: 0;
    }

    .auth-card .form-group {
        margin-bottom: 1.25rem;
    }

    .auth-card label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255,255,255,0.75);
        letter-spacing: 0.02em;
    }

    .auth-card input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        font-size: 0.95rem;
        color: #fff;
        font-family: inherit;
        transition: border-color 0.2s, background 0.2s;
    }

    .auth-card input::placeholder {
        color: rgba(255,255,255,0.25);
    }

    .auth-card input:focus {
        outline: none;
        border-color: #dc3545;
        background: rgba(220,53,69,0.08);
        box-shadow: 0 0 0 3px rgba(220,53,69,0.15);
    }

    .btn-auth {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #dc3545, #ff4d6d);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 20px rgba(220,53,69,0.35);
        margin-top: 0.5rem;
    }

    .btn-auth:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 28px rgba(220,53,69,0.5);
    }

    .btn-auth:active {
        transform: translateY(0);
    }

    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.88rem;
        color: rgba(255,255,255,0.45);
    }

    .auth-footer a {
        color: #ff6b7a;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .error-msg {
        background: rgba(220,53,69,0.15);
        border: 1px solid rgba(220,53,69,0.35);
        color: #ff6b7a;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.88rem;
        margin-bottom: 1rem;
        display: none;
    }

    .error-msg.visible {
        display: block;
    }

    .input-icon-wrap {
        position: relative;
    }

    .input-icon-wrap .icon {
        position: absolute;
        left: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        pointer-events: none;
    }

    .input-icon-wrap input {
        padding-left: 2.5rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🩸</div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your LifeLink account</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-icon-wrap">
                    <span class="icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrap">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-auth" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}">Create one free</a>
        </div>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorMsg.classList.remove('visible');
        submitBtn.textContent = 'Signing in…';
        submitBtn.disabled = true;

        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('{{ url_for("login") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token() }}'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = result.redirect;
            } else {
                errorMsg.textContent = result.error || 'Invalid credentials. Please try again.';
                errorMsg.classList.add('visible');
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }
        } catch (error) {
            errorMsg.textContent = 'Network error. Please try again.';
            errorMsg.classList.add('visible');
            submitBtn.textContent = 'Sign In';
            submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
