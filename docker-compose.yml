services:
  mysql:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lifelink}
      MYSQL_USER: ${DB_USER:-lifelink}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lifelink-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifelink-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lifelink}
      DB_USER: ${DB_USER:-lifelink}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      FLYWAY_ENABLED: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lifelink.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ADMIN_FULL_NAME: "System Administrator"
      ADMIN_PHONE: "+919876543210"
      ADMIN_CITY: "Bengaluru"
      ADMIN_STATE: "Karnataka"
      REQUEST_EXPIRATION_INTERVAL_MS: "900000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 35s
    networks:
      - lifelink-network

volumes:
  mysql_data:
    driver: local

networks:
  lifelink-network:
    driver: bridge
