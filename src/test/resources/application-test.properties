# ===================================================================
# Test Configuration (H2 In-Memory with Flyway Migration & Validation)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:lifelink_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enforce Hibernate ddl-auto=validate against Flyway schema in tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.mail.host=localhost
spring.mail.port=2525

lifelink.scheduler.request-expiration.interval-ms=3600000
lifelink.admin.password=TestAdminPass123

# Disable mail health indicator in tests to prevent conflicts with mocked JavaMailSender
management.health.mail.enabled=false
