# ===================================================================
# LifeLink Application Configuration
# Driven by environment variables with sensible local defaults
# ===================================================================

# Application
spring.application.name=lifelink
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lifelink}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
# Schema management is strictly handled by Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Migrations
# -------------------------------------------------------------------
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# Thymeleaf Template Engine
# -------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# -------------------------------------------------------------------
# Mail Configuration (JavaMailSender)
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -------------------------------------------------------------------
# LifeLink Custom Business Properties
# -------------------------------------------------------------------
lifelink.mail.from=${MAIL_FROM:no-reply@lifelink.org}
lifelink.donor.eligibility-days=90
lifelink.matching.mode=${MATCHING_MODE:EXACT}
lifelink.matching.min-threshold=${MATCHING_MIN_THRESHOLD:3}
lifelink.matching.max-matches=${MATCHING_MAX_MATCHES:25}

# -------------------------------------------------------------------
# Scheduled Background Jobs
# -------------------------------------------------------------------
# Configurable interval for expiring overdue blood requests (default: 15 minutes = 900000 ms)
lifelink.scheduler.request-expiration.interval-ms=${REQUEST_EXPIRATION_INTERVAL_MS:900000}

# -------------------------------------------------------------------
# Default Administrator Seed Configuration
# -------------------------------------------------------------------
lifelink.admin.username=${ADMIN_USERNAME:admin}
lifelink.admin.email=${ADMIN_EMAIL:admin@lifelink.org}
lifelink.admin.password=${ADMIN_PASSWORD:Admin@1234}
lifelink.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
lifelink.admin.phone=${ADMIN_PHONE:9999999999}
lifelink.admin.city=${ADMIN_CITY:Mumbai}
lifelink.admin.state=${ADMIN_STATE:Maharashtra}

# -------------------------------------------------------------------
# Spring Boot Actuator & Health Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

