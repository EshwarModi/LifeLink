<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Post Blood Request — LifeLink')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main>
        <div class="form-container" style="max-width: 680px;">
            <div class="card">
                <h2 style="color: var(--color-secondary); margin-bottom: 0.5rem;">Post an Urgent Blood Request</h2>
                <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
                    Our automated matching algorithm will immediately alert eligible donors nearby.
                </p>

                <div th:replace="~{fragments/layout :: alerts}"></div>

                <!-- Create Request Form with CSRF token -->
                <form th:action="@{/requests}" th:object="${requestDto}" method="post">

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="bloodGroup">Blood Group Required *</label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-control" required>
                                <option value="">Select Blood Group</option>
                                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.label}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="unitsNeeded">Units Needed (1 - 20) *</label>
                            <input type="number" id="unitsNeeded" th:field="*{unitsNeeded}" class="form-control"
                                   min="1" max="20" placeholder="e.g. 2" required>
                            <span class="field-error" th:if="${#fields.hasErrors('unitsNeeded')}" th:errors="*{unitsNeeded}"></span>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="urgency">Urgency Level *</label>
                            <select id="urgency" th:field="*{urgency}" class="form-control" required>
                                <option th:each="u : ${urgencies}" th:value="${u}" th:text="${u.label}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('urgency')}" th:errors="*{urgency}"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="requiredBy">Required By (Future Date) *</label>
                            <input type="date" id="requiredBy" th:field="*{requiredBy}" class="form-control" required>
                            <small style="color: var(--color-text-muted); font-size: 0.8rem;">Must be strictly after today.</small>
                            <span class="field-error" th:if="${#fields.hasErrors('requiredBy')}" th:errors="*{requiredBy}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="hospitalName">Hospital / Medical Center Name *</label>
                        <input type="text" id="hospitalName" th:field="*{hospitalName}" class="form-control"
                               placeholder="e.g. Apollo Memorial Hospital" required>
                        <span class="field-error" th:if="${#fields.hasErrors('hospitalName')}" th:errors="*{hospitalName}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="hospitalAddress">Hospital Street Address *</label>
                        <input type="text" id="hospitalAddress" th:field="*{hospitalAddress}" class="form-control"
                               placeholder="e.g. Ward 4B, 123 Health Ave, Mumbai" required>
                        <span class="field-error" th:if="${#fields.hasErrors('hospitalAddress')}" th:errors="*{hospitalAddress}"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reason">Clinical Reason / Patient Context (optional)</label>
                        <textarea id="reason" th:field="*{reason}" class="form-control" rows="3"
                                  placeholder="e.g. Scheduled cardiac surgery or urgent trauma replenishment..."></textarea>
                        <span class="field-error" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></span>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                        <a th:href="@{/seeker/dashboard}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg">Publish Request & Match Donors</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
