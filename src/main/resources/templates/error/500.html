<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Server Error (500) — LifeLink')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="error-page-container">
            <div class="error-card" role="alert">
                <!-- Friendly SVG Illustration: Pulse Line & Heart Recovery -->
                <div class="error-illustration" aria-hidden="true">
                    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="80" cy="80" r="72" fill="#FEF2F2" />
                        <circle cx="80" cy="80" r="58" fill="#FEE2E2" fill-opacity="0.6" />
                        <!-- Monitor Screen -->
                        <rect x="42" y="50" width="76" height="52" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="3" />
                        <rect x="48" y="56" width="64" height="40" rx="4" fill="#FFF5F5" />
                        <!-- Monitor Stand -->
                        <path d="M72 102H88V112H72V102Z" fill="#DC2626" />
                        <path d="M60 112H100" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />
                        <!-- Reconnecting Pulse ECG Line -->
                        <path d="M52 76H64L68 66L74 86L80 72L84 76H92"
                              stroke="#B3122B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        <!-- Heartbeat Icon -->
                        <circle cx="98" cy="76" r="3" fill="#DC2626" />
                    </svg>
                </div>

                <div class="error-code-badge error-code-500">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-pulse"></use></svg>
                    <span>HTTP 500 &bull; Server Issue</span>
                </div>

                <h1 class="error-title">Something went wrong on our side.</h1>

                <p class="error-description">
                    An unexpected glitch occurred while processing your request. Please try again shortly.
                </p>

                <div class="error-actions">
                    <!-- When authenticated: Go to dashboard as primary, Go home as secondary -->
                    <a th:href="@{/dashboard}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-user"></use></svg>
                        Go to dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary" sec:authorize="isAuthenticated()">
                        Go home
                    </a>

                    <!-- When anonymous: Go home as primary, Browse requests as secondary -->
                    <a th:href="@{/}" class="btn btn-primary" sec:authorize="isAnonymous()">
                        Go home
                    </a>
                    <a th:href="@{/requests}" class="btn btn-secondary" sec:authorize="isAnonymous()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-drop"></use></svg>
                        Browse requests
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
