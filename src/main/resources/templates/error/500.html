<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('LifeLink — Server Error (500)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="card" style="max-width: 580px; margin: var(--space-8) auto; text-align: center; padding: var(--space-10) var(--space-6);">
            <div class="empty-state-icon" style="background-color: var(--color-danger-bg); color: var(--color-danger); margin-bottom: var(--space-4);">
                <svg class="icon icon-xl" aria-hidden="true"><use href="#icon-alert"></use></svg>
            </div>
            <h1 style="font-size: 3.5rem; color: var(--color-danger); margin-bottom: var(--space-2);">500</h1>
            <h2 style="margin-bottom: var(--space-3);">Internal Server Error</h2>
            <p style="color: var(--color-text-muted); margin-bottom: var(--space-6);" th:text="${message} ?: 'An unexpected server error occurred. Our engineering team has been alerted.'">
                An unexpected server error occurred. Our engineering team has been alerted.
            </p>
            <div style="display: flex; justify-content: center; gap: var(--space-3);">
                <a th:href="@{/}" class="btn btn-primary">Return to Home</a>
                <a th:href="@{/requests}" class="btn btn-secondary">Open Requests</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
