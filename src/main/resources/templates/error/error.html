<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Request Error — LifeLink')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="error-page-container">
            <div class="error-card" role="alert">
                <!-- Friendly SVG Illustration: Hourglass / Clock Pace -->
                <div class="error-illustration" aria-hidden="true">
                    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="80" cy="80" r="72" fill="#F8FAFC" />
                        <circle cx="80" cy="80" r="58" fill="#F1F5F9" />
                        <!-- Outer Rim -->
                        <circle cx="80" cy="80" r="34" fill="#FFFFFF" stroke="#475569" stroke-width="3" />
                        <!-- Clock hands / Hourglass indication -->
                        <path d="M80 58V80L95 90" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />
                        <circle cx="80" cy="80" r="3.5" fill="#0F172A" />
                        <!-- Gentle notice indicator -->
                        <circle cx="106" cy="54" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5" />
                        <path d="M106 48V54" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
                        <circle cx="106" cy="58" r="1.5" fill="#FFFFFF" />
                    </svg>
                </div>

                <!-- Context-Aware Badge -->
                <div th:if="${status == 429}" class="error-code-badge error-code-429">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-clock"></use></svg>
                    <span>HTTP 429 &bull; Rate Limited</span>
                </div>
                <div th:if="${status == 409}" class="error-code-badge error-code-409">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-clock"></use></svg>
                    <span>HTTP 409 &bull; State Conflict</span>
                </div>
                <div th:if="${status != 429 and status != 409}" class="error-code-badge error-code-403">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-info"></use></svg>
                    <span th:text="${status != null ? 'HTTP ' + status + ' &bull; ' + (error ?: 'Request Error') : 'Request Error'}">HTTP 400 &bull; Bad Request</span>
                </div>

                <!-- Context-Aware Human Headline -->
                <h1 th:if="${status == 429}" class="error-title">Please wait before trying again.</h1>
                <h1 th:if="${status == 409}" class="error-title">Action no longer available.</h1>
                <h1 th:if="${status != 429 and status != 409}" class="error-title">Unable to complete your request.</h1>

                <!-- One Sentence Humane Explanation -->
                <p class="error-description" th:text="${message} ?: 'The requested operation could not be processed with the provided information.'">
                    The requested operation could not be processed with the provided information.
                </p>

                <div class="error-actions">
                    <!-- When authenticated: Go to dashboard as primary, Go home as secondary -->
                    <a th:href="@{/dashboard}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-user"></use></svg>
                        Go to dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary" sec:authorize="isAuthenticated()">
                        Go home
                    </a>

                    <!-- When anonymous: Go home as primary, Sign in as secondary -->
                    <a th:href="@{/}" class="btn btn-primary" sec:authorize="isAnonymous()">
                        Go home
                    </a>
                    <a th:href="@{/login}" class="btn btn-secondary" sec:authorize="isAnonymous()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-user"></use></svg>
                        Log in
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
