<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('LifeLink — Access Denied (403)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="card" style="max-width: 580px; margin: var(--space-8) auto; text-align: center; padding: var(--space-10) var(--space-6);">
            <div class="empty-state-icon" style="background-color: var(--color-urgency-medium-bg); color: var(--color-urgency-medium); margin-bottom: var(--space-4);">
                <svg class="icon icon-xl" aria-hidden="true"><use href="#icon-alert"></use></svg>
            </div>
            <h1 style="font-size: 3.5rem; color: var(--color-urgency-medium); margin-bottom: var(--space-2);">403</h1>
            <h2 style="margin-bottom: var(--space-3);">Access Forbidden</h2>
            <p style="color: var(--color-text-muted); margin-bottom: var(--space-6);" th:text="${message} ?: 'You do not have permission to view or modify this resource.'">
                You do not have permission to view or modify this resource.
            </p>
            <div style="display: flex; justify-content: center; gap: var(--space-3);">
                <a th:href="@{/dashboard}" class="btn btn-primary">Go to My Dashboard</a>
                <a th:href="@{/}" class="btn btn-secondary">Platform Home</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
