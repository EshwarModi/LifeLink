<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink — Access Denied (403)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; text-align: center; padding: 5rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 4rem; color: #d97706; margin: 0; }
        h2 { font-size: 1.5rem; margin: 1rem 0; }
        p { color: #64748b; margin-bottom: 2rem; }
        a { display: inline-block; background: #d97706; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
        a:hover { background: #b45309; }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <h2>Access Forbidden</h2>
        <p th:text="${message} ?: 'You do not have permission to view or modify this resource.'">Access Denied.</p>
        <a th:href="@{/dashboard}">Go to Dashboard</a>
    </div>
</body>
</html>
