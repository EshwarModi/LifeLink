<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink — Page Not Found (404)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; text-align: center; padding: 5rem 1rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 4rem; color: #dc2626; margin: 0; }
        h2 { font-size: 1.5rem; margin: 1rem 0; }
        p { color: #64748b; margin-bottom: 2rem; }
        a { display: inline-block; background: #dc2626; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
        a:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p th:text="${message} ?: 'The requested page or record could not be found.'">The page you were looking for could not be found.</p>
        <a th:href="@{/}">Return Home</a>
    </div>
</body>
</html>
