<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Page Not Found (404) — LifeLink')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="error-page-container">
            <div class="error-card" role="alert">
                <!-- Friendly SVG Illustration: Magnifying Glass & Blood Drop -->
                <div class="error-illustration" aria-hidden="true">
                    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="80" cy="80" r="72" fill="#EFF6FF" />
                        <circle cx="80" cy="80" r="58" fill="#DBEAFE" fill-opacity="0.5" />
                        <!-- Dashed Search Arc -->
                        <path d="M40 80C40 57.9 57.9 40 80 40C93.4 40 105.2 46.6 112.5 56.8"
                              stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" />
                        <!-- Lens Rim -->
                        <circle cx="74" cy="74" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" />
                        <!-- Blood Drop inside lens -->
                        <path d="M74 54C74 54 62 68 62 76C62 82.63 67.37 88 74 88C80.63 88 86 82.63 86 76C86 68 74 54 74 54Z"
                              fill="#B3122B" />
                        <ellipse cx="71" cy="74" rx="2" ry="4" fill="#FFFFFF" fill-opacity="0.4" />
                        <!-- Handle -->
                        <path d="M97 97L122 122" stroke="#1E40AF" stroke-width="6" stroke-linecap="round" />
                        <path d="M112 112L122 122" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
                    </svg>
                </div>

                <div class="error-code-badge error-code-404">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-info"></use></svg>
                    <span>HTTP 404 &bull; Not Found</span>
                </div>

                <h1 class="error-title">We couldn't find that page.</h1>

                <p class="error-description" th:text="${message} ?: 'The link may be outdated, or the blood request may have been removed.'">
                    The link may be outdated, or the blood request may have been removed.
                </p>

                <div class="error-actions">
                    <!-- When authenticated: Go to dashboard as primary, Go home as secondary -->
                    <a th:href="@{/dashboard}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-user"></use></svg>
                        Go to dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary" sec:authorize="isAuthenticated()">
                        Go home
                    </a>

                    <!-- When anonymous: Go home as primary, Browse requests as secondary -->
                    <a th:href="@{/}" class="btn btn-primary" sec:authorize="isAnonymous()">
                        Go home
                    </a>
                    <a th:href="@{/requests}" class="btn btn-secondary" sec:authorize="isAnonymous()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-drop"></use></svg>
                        Browse requests
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
