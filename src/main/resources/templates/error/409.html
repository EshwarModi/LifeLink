<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('LifeLink — Action No Longer Available (409)')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="card" style="max-width: 580px; margin: var(--space-8) auto; text-align: center; padding: var(--space-10) var(--space-6);">
            <div class="empty-state-icon" style="background-color: var(--color-urgency-medium-bg); color: var(--color-urgency-medium); margin-bottom: var(--space-4);">
                <svg class="icon icon-xl" aria-hidden="true"><use href="#icon-clock"></use></svg>
            </div>
            <h1 style="font-size: 3.5rem; color: var(--color-urgency-medium); margin-bottom: var(--space-2);" th:text="${status} ?: '409'">409</h1>
            <h2 style="margin-bottom: var(--space-3);" th:text="${error} ?: 'Action No Longer Available'">Action No Longer Available</h2>
            <p style="color: var(--color-text-muted); margin-bottom: var(--space-6);" th:text="${message} ?: 'This request or match has already changed state and cannot be updated.'">
                This request or match has already changed state and cannot be updated.
            </p>
            <div style="display: flex; justify-content: center; gap: var(--space-3);">
                <a th:href="@{/dashboard}" class="btn btn-primary">Return to Dashboard</a>
                <a th:href="@{/requests}" class="btn btn-secondary">Browse Requests</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
