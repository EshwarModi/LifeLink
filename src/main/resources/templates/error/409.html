<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Action Not Available (409) — LifeLink')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>

    <main id="mainContent">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="error-page-container">
            <div class="error-card" role="alert">
                <!-- Friendly SVG Illustration: State Transition Completed -->
                <div class="error-illustration" aria-hidden="true">
                    <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="80" cy="80" r="72" fill="#FFFBEB" />
                        <circle cx="80" cy="80" r="58" fill="#FEF3C7" fill-opacity="0.6" />
                        <!-- Clock Dial -->
                        <circle cx="80" cy="80" r="34" fill="#FFFFFF" stroke="#D97706" stroke-width="3" />
                        <!-- Clock Hands pointing to past -->
                        <path d="M80 58V80L94 90" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" />
                        <circle cx="80" cy="80" r="3" fill="#B45309" />
                        <!-- Refresh / Changed State Badge -->
                        <circle cx="106" cy="54" r="14" fill="#0D9488" stroke="#FFFFFF" stroke-width="2.5" />
                        <path d="M102 54L105 57L111 51" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>

                <div class="error-code-badge error-code-409">
                    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-clock"></use></svg>
                    <span>HTTP 409 &bull; State Conflict</span>
                </div>

                <h1 class="error-title">Action no longer available.</h1>

                <p class="error-description" th:text="${message} ?: 'This blood request or donor match has already changed state and can no longer be updated.'">
                    This blood request or donor match has already changed state and can no longer be updated.
                </p>

                <div class="error-actions">
                    <!-- When authenticated: Go to dashboard as primary, Go home as secondary -->
                    <a th:href="@{/dashboard}" class="btn btn-primary" sec:authorize="isAuthenticated()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-user"></use></svg>
                        Go to dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary" sec:authorize="isAuthenticated()">
                        Go home
                    </a>

                    <!-- When anonymous: Go home as primary, Browse requests as secondary -->
                    <a th:href="@{/}" class="btn btn-primary" sec:authorize="isAnonymous()">
                        Go home
                    </a>
                    <a th:href="@{/requests}" class="btn btn-secondary" sec:authorize="isAnonymous()">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-drop"></use></svg>
                        Browse requests
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
